services:
  # Один сервис: Node раздаёт собранный сайт (dist) и API (/api/*)
  - type: web
    name: biosphere-vet
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd biosphere-vet-clinic && npm install && npm run build
    startCommand: cd biosphere-vet-clinic && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.x
      - key: SESSION_SECRET
        generateValue: true
      # Задайте вручную в Render Dashboard (не храните в git):
      # - ADMIN_PASSWORD   — пароль входа в /admin (не короче 10 символов)
      # Необязательные:
      # - INDEXING=on      — разрешить индексацию поисковиками (когда сайт станет основным)
      # - KEEPALIVE=off    — выключить «антисон» (самопинг каждые 10 минут)
      # - KEEPALIVE_MIN=10 — интервал антисна в минутах
